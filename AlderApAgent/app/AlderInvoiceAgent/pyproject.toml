[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AlderInvoiceAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "opentelemetry-instrumentation-langchain >= 0.59.0",
    "langgraph >= 1.0.2",
    "bedrock-agentcore >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    "langchain-aws >= 1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.14.0",
    "boto3>=1.43.111",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
